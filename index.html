<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WHOOP Lab Helper</title>

<style>
  :root {
    --bg: #ffffff;
    --text-color: #000000;
    --card-bg: #f5f5f5;
    --divider: #dddddd;
    --input-bg: #ffffff;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    background: var(--bg);
    color: var(--text-color);
  }

  .wrap {
    max-width: 640px;
    margin: auto;
    padding: 24px 16px 80px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
  }

  #themeToggle {
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    background: var(--card-bg);
    border: 1px solid var(--divider);
  }

  /* Search Box */
  #searchInput {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid var(--divider);
    margin-bottom: 20px;
    background: var(--input-bg);
    color: var(--text-color);
    box-sizing: border-box;
  }
</style>
</head>

<body>
  <div class="wrap">

    <!-- HEADER -->
    <div class="header">
      <div class="title">WHOOP Lab Helper</div>

      <!-- Toggle -->
      <div id="themeToggle">WHOOP</div>
    </div>

    <!-- SEARCH -->
    <input 
      id="searchInput"
      type="text"
      placeholder="Tìm theo tên WHOOP hoặc Hoà Hảo… (ví dụ: 'acid uric', 'uric acid')"
    />

    <!-- LIST -->
    <div id="listContainer"></div>
  </div>

  <!-- MODULE LOADER -->
  <script type="module">
    import { pinned_list } from "./pinned.js";
    import { biomarkers_list } from "./biomarkers.js";
    import { initApp } from "./script.js";

    window.addEventListener("DOMContentLoaded", () => {
      initApp(pinned_list, biomarkers_list);
    });
  </script>
</body>
</html>
