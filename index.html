<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHOOPSaigon Advanced Labs Helper</title>

<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        background: #0b0b0c;
        color: #fff;
        transition: background 0.3s, color 0.3s;
    }

    body.light {
        background: #f7f7f7;
        color: #111;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 22px;
    }

    h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 10px;
    }

    .desc {
        opacity: 0.8;
        margin-bottom: 25px;
        line-height: 1.4;
    }

    /* ───────── SEARCH BAR ───────── */
    .search-box {
        display: flex;
        align-items: center;
        background: #1a1a1d;
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 20px;
    }
    body.light .search-box {
        background: #ffffff;
        border: 1px solid #ccc;
    }

    .search-box input {
        width: 100%;
        background: transparent;
        border: none;
        color: inherit;
        font-size: 16px;
        outline: none;
    }

    /* ───────── THEME SWITCH ───────── */
    .theme-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        cursor: pointer;
        user-select: none;
    }

    .theme-toggle svg {
        width: 22px;
        height: 22px;
    }

    /* ───────── BIOMARKER CARD ───────── */
    .card {
        background: #141417;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        transition: background 0.2s;
    }
    body.light .card {
        background: #ffffff;
        border: 1px solid #ddd;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        font-size: 17px;
        font-weight: 600;
    }

    .hh-info {
        margin-top: 16px;
        padding: 14px;
        border-radius: 10px;
        background: #1c1c20;
        line-height: 1.5;
    }
    body.light .hh-info {
        background: #f0f0f0;
    }

    .input-row {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .input-row input {
        padding: 10px;
        background: #0f0f11;
        color: #fff;
        border-radius: 8px;
        border: 1px solid #333;
        font-size: 15px;
    }
    body.light .input-row input {
        background: white;
        color: black;
        border: 1px solid #bbb;
    }

    .result-box {
        margin-top: 12px;
        font-weight: 600;
        padding: 10px;
        background: #0d2612;
        border-radius: 8px;
        color: #7dff9b;
    }
    body.light .result-box {
        background: #d8ffe8;
        color: #054a1a;
    }

    /* hidden body */
    .card-body { display: none; }
    .card-body.open { display: block; }

</style>

</head>
<body>

<div class="container">

    <h1>WHOOPSaigon Advanced Labs Helper</h1>
    <div class="desc">
        Công cụ giúp bạn đổi đơn vị, tính toán, và tìm đúng tên chỉ số Hoà Hảo tương ứng với WHOOP.
    </div>

    <!-- THEME SWITCH -->
    <div class="theme-toggle" id="themeToggle">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Dark</span>
    </div>

    <!-- SEARCH / FILTER -->
    <div class="search-box">
        <input id="searchInput" type="text" placeholder="Tìm theo tên WHOOP hoặc Hoà Hảo…">
    </div>

    <!-- BIOMARKER LIST -->
    <div id="biomarkerList"></div>

</div>

<!-- MAIN SCRIPT -->
<script type="module" src="./script.js"></script>

</body>
</html>
