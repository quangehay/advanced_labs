<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHOOP → Hoà Hảo Conversion Tool</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 900px;
            margin: auto;
            position: relative;
        }

        html[data-theme="dark"] {
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --border: #333;
            --text: #f5f5f5;
            --subtext: #bbbbbb;
            --accent: #5ac8fa;
            --line: #2a2a2a;
            --result-green: #8dd8a0;
            --result-green-dark: #4da066;
        }

        html[data-theme="light"] {
            --bg: #ffffff;
            --card: #fafafa;
            --border: #ddd;
            --text: #222;
            --subtext: #555;
            --accent: #007aff;
            --line: #eeeeee;
            --result-green: #4ca46b;
            --result-green-dark: #2d7b49;
        }

        /* TOP RIGHT THEME BUTTON */
        #themeButton {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            z-index: 999;
            user-select: none;
            transition: background 0.2s, border-color 0.2s;
        }

        #themeButton:hover {
            background: var(--border);
        }

        .header { margin-bottom: 25px; }
        h1 { font-size: 24px; margin-bottom: 10px; font-weight: 700; }

        .desc {
            color: var(--subtext);
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        #searchBox {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 16px;
            color: var(--text);
            margin-bottom: 25px;
        }

        #searchBox:focus { outline: 2px solid var(--accent); }

        .biomarker-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 15px 18px;
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .bio-header {
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            padding: 4px 0;
        }

        .bio-body { margin-top: 14px; display: none; }

        /* LABEL (Tên Hoà Hảo) */
        .label {
            font-size: 14px;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .input-row input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            text-align: center;
        }

        .unit {
            padding: 10px;
            font-size: 13px;
            color: var(--subtext);
            width: 70px;
            text-align: center;
        }

        /* RESULT */
        .result-section { margin-top: 18px; }

        .result-title {
            color: var(--subtext);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            margin: 18px 0 12px 0;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-title::before,
        .result-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .result-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .result-num {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 20px;
            font-weight: 600;
            color: var(--result-green);
        }

        .copy-chip {
            padding: 4px 10px;
            border-radius: 10px;
            cursor: pointer;
            background: var(--border);
            color: var(--text);
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            user-select: none;
            transition: background 0.2s;
        }

        .copy-chip.copied {
            background: var(--result-green-dark);
            color: #fff;
        }

        .result-explain {
            margin-top: 8px;
            font-size: 12px;
            color: var(--subtext);
            text-align: center;
            line-height: 1.35;
            padding: 0 8px;
        }

        .explain {
            font-size: 12px;
            color: var(--subtext);
            margin-top: 6px;
        }
    </style>
</head>

<body>

    <div id="themeButton">Bật đèn</div>

    <div class="header">
        <h1>WHOOP → Hoà Hảo Conversion Tool</h1>
        <div class="desc">
            Nhập các giá trị từ xét nghiệm Hoà Hảo để xem cách điền đúng vào ứng dụng WHOOP.
        </div>

        <input id="searchBox" type="text" placeholder="Lọc theo tên WHOOP hoặc Hoà Hảo..." />
    </div>

    <div id="biomarkerContainer"></div>

    <script type="module" src="pinned.js"></script>
    <script type="module" src="biomarkers.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
