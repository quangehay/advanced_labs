<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WHOOP Lab Helper</title>

<style>
  :root {
    --bg: #ffffff;
    --text-color: #000000;
    --card-bg: #f5f5f5;
    --divider: #e1e1e1;
    --input-bg: #ffffff;
    --accent: #00ccb4;
  }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  }

  .wrap {
    max-width: 680px;
    margin: auto;
    padding: 20px 16px 100px;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
  }

  /* THEME BUTTON */
  #themeToggle {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid var(--divider);
  }
  #themeToggle svg {
    width: 20px;
    height: 20px;
  }

  /* DESCRIPTION */
  .desc {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 20px;
    line-height: 1.45;
  }

  /* SEARCH */
  #searchInput {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    box-sizing: border-box;
    border-radius: 10px;
    border: 1px solid var(--divider);
    background: var(--input-bg);
    color: var(--text-color);
    margin-bottom: 18px;
  }
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="title">WHOOP Lab Helper</div>

    <!-- Moon / Sun toggle -->
    <div id="themeToggle">
      <!-- default icon: moon -->
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </div>
  </div>

  <!-- DESCRIPTION -->
  <div class="desc">
    Dùng công cụ này khi WHOOP không đọc được một số chỉ số từ xét nghiệm Hoà Hảo.
    Tìm theo tên <b>WHOOP</b> (như trong app), mở rộng, nhập đúng giá trị Hoà Hảo,
    và công cụ sẽ tự động chuyển đổi/calculate sang giá trị WHOOP.
  </div>

  <!-- SEARCH -->
  <input 
    id="searchInput" 
    type="text" 
    placeholder="Tìm theo tên WHOOP hoặc Hoà Hảo… (ví dụ: 'acid uric', 'uric acid')"
  />

  <!-- RESULTS LIST -->
  <div id="listContainer"></div>

</div>

<!-- JS MODULE LOADER -->
<script type="module">
  import { pinned_list } from "./pinned.js";
  import { biomarkers_list } from "./biomarkers.js";
  import { initApp } from "./script.js";

  // Theme toggling with SVG icon swap
  const themeBtn = document.getElementById("themeToggle");
  const icon = document.getElementById("themeIcon");
  let mode = "light";

  function setTheme(m) {
    const root = document.documentElement;

    if (m === "dark") {
      root.style.setProperty("--bg", "#0f0f0f");
      root.style.setProperty("--text-color", "#ffffff");
      root.style.setProperty("--card-bg", "#1a1a1a");
      root.style.setProperty("--divider", "#333333");
      root.style.setProperty("--input-bg", "#111111");

      // Sun icon
      icon.innerHTML = `
        <circle cx="12" cy="12" r="5" stroke-width="2" stroke="currentColor"/>
        <line x1="12" y1="1" x2="12" y2="3" stroke-width="2"/>
        <line x1="12" y1="21" x2="12" y2="23" stroke-width="2"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke-width="2"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke-width="2"/>
        <line x1="1" y1="12" x2="3" y2="12" stroke-width="2"/>
        <line x1="21" y1="12" x2="23" y2="12" stroke-width="2"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke-width="2"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke-width="2"/>
      `;
    } else {
      root.style.setProperty("--bg", "#ffffff");
      root.style.setProperty("--text-color", "#000000");
      root.style.setProperty("--card-bg", "#f5f5f5");
      root.style.setProperty("--divider", "#dddddd");
      root.style.setProperty("--input-bg", "#ffffff");

      // Moon icon
      icon.innerHTML = `
        <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      `;
    }
  }

  setTheme("light");

  themeBtn.onclick = () => {
    mode = mode === "light" ? "dark" : "light";
    setTheme(mode);
  };

  // Initialize app
  window.addEventListener("DOMContentLoaded", () => {
    initApp(pinned_list, biomarkers_list);
  });
</script>

</body>
</html>
